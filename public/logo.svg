<?xml version="1.0" encoding="utf-8"?>
<!--
  2026-09-23 换图标（用户附图 imagef8c6a346 + "完全占满"要求）：
  黑色立方体 Z 字撑满整个圆角方形。之前四周留白太多显得空。
  现在立方体的三个面（顶面/左面/右面）拼成一个 32x32 满铺的正投影立方体，
  外框用 clipPath 做 7px 圆角，与浏览器标签 / 侧栏品牌区的形状一致。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <clipPath id="rounded">
      <rect width="32" height="32" rx="7" ry="7"/>
    </clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <!-- 底衬（黑色，保证 clipPath 之外没露白） -->
    <rect width="32" height="32" fill="#111418"/>
    <!-- 顶面：受光最深灰 -->
    <polygon points="0,8 16,2 32,8 16,14" fill="#2a2e35"/>
    <!-- 右侧面：暗一档，模拟阴影 -->
    <polygon points="32,8 32,24 16,30 16,14" fill="#1a1e24"/>
    <!-- 左侧面：中间调 -->
    <polygon points="0,8 16,14 16,30 0,24" fill="#16191e"/>
    <!-- Z 字母：白描边、粗一档、圆角端点 -->
    <path d="M8,16 L24,16 L10,24 L24,24"
          fill="none" stroke="#ffffff" stroke-width="2.6"
          stroke-linejoin="round" stroke-linecap="round"/>
  </g>
</svg>
